name: CI

on:
  push:
    branches: [ "main", "v4-experimental" ]
  pull_request:
    branches: [ "main", "v4-experimental" ]

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Setup Linux (Ubuntu) ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev qt6-base-dev qt6-tools-dev ninja-build

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        run: ./build/UmpParserTests

      # --- Setup Windows ---
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: 'true'

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build Project (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Run Automated Tests (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tests\run_tests.ps1 -SkipBuild
